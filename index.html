<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Remarried Empress - Playlist Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: #161622;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid #252536;
        }

        .header {
            padding: 20px 25px;
            background: #1e1e2d;
            border-bottom: 1px solid #2b2b40;
        }

        .header h1 {
            font-size: 1.25rem;
            color: #f0f0f5;
            font-weight: 600;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .playlist-section {
            background: #161622;
        }

        .playlist-header {
            padding: 15px 25px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8aab;
            border-bottom: 1px solid #222233;
        }

        .playlist {
            list-style: none;
            max-height: 280px;
            overflow-y: auto;
        }

        .playlist::-webkit-scrollbar {
            width: 6px;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: #2b2b40;
            border-radius: 3px;
        }

        .playlist li {
            padding: 16px 25px;
            border-bottom: 1px solid #1f1f2e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s ease;
        }

        .playlist li:hover {
            background: #1f1f2e;
        }

        .playlist li.active {
            background: #25253d;
            border-left: 4px solid #7c5cfc;
        }

        .playlist li .track-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .playlist li .title {
            font-size: 0.95rem;
            color: #dcdce6;
        }

        .playlist li.active .title {
            color: #ffffff;
            font-weight: 600;
        }

        .playlist li .resolution {
            font-size: 0.75rem;
            color: #8a8aab;
        }

        .playlist li .status-badge {
            font-size: 0.75rem;
            background: #2b2b40;
            padding: 4px 10px;
            border-radius: 20px;
            color: #aaa;
        }

        .playlist li.active .status-badge {
            background: #7c5cfc;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="current-title">Loading Playlist...</h1>
        </div>

        <div class="video-container">
            <iframe id="video-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>

        <div class="playlist-section">
            <div class="playlist-header">Episodes Playlist</div>
            <ul class="playlist" id="playlist"></ul>
        </div>
    </div>

    <script>
        const episodes = [
            {
                title: "The Remarried Empress Hindi Fan Dubbed S01E01",
                resolution: "1080p",
                src: "https://drive.google.com/file/d/1W71XKH48n_MphepQ5SL0EtnQDtUZH-50/preview"
            },
            {
                title: "The Remarried Empress Hindi Fan Dubbed S01E02",
                resolution: "1080p",
                src: "https://drive.google.com/file/d/1WGtwiIi81qiAO_btQkHrHbrVQlCwkLQr/preview"
            },
            {
                title: "The Remarried Empress Hindi Fan Dubbed S01E03",
                resolution: "480p",
                src: "https://drive.google.com/file/d/1mSR18Qs362a5zmbyBEYhmkg7Md4yxjTi/preview"
            },
            {
                title: "The Remarried Empress Hindi Fan Dubbed S01E04",
                resolution: "1080p",
                src: "https://drive.google.com/file/d/1LnKXvCuRj7Rkw_sMrB-CvExPnprh1W_r/preview"
            }
        ];

        const iframe = document.getElementById('video-iframe');
        const playlistUI = document.getElementById('playlist');
        const currentTitleUI = document.getElementById('current-title');

        function loadEpisode(index) {
            const episode = episodes[index];
            iframe.src = episode.src;
            currentTitleUI.textContent = `${episode.title} [${episode.resolution}]`;

            document.querySelectorAll('#playlist li').forEach((li, i) => {
                li.classList.toggle('active', i === index);
                const badge = li.querySelector('.status-badge');
                badge.textContent = i === index ? 'Playing' : 'Play';
            });
        }

        episodes.forEach((episode, index) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="track-info">
                    <span class="title">${episode.title}</span>
                    <span class="resolution">${episode.resolution}</span>
                </div>
                <span class="status-badge">Play</span>
            `;
            li.addEventListener('click', () => loadEpisode(index));
            playlistUI.appendChild(li);
        });

        if (episodes.length > 0) {
            loadEpisode(0);
        }
    </script>
</body>
</html>
