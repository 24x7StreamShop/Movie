<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Remarried Empress - Download Episodes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d12;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: #161622;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid #252536;
        }

        .header {
            padding: 20px 24px;
            background: #1e1e2d;
            border-bottom: 1px solid #2b2b40;
            text-align: center;
        }

        .header h1 {
            font-size: clamp(1rem, 4vw, 1.35rem);
            color: #f0f0f5;
            font-weight: 600;
        }

        .header p {
            font-size: 0.85rem;
            color: #8a8aab;
            margin-top: 6px;
        }

        .playlist-section {
            background: #161622;
        }

        .playlist-header {
            padding: 15px 24px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8aab;
            border-bottom: 1px solid #222233;
        }

        .playlist {
            list-style: none;
            max-height: 450px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .playlist::-webkit-scrollbar {
            width: 5px;
        }

        .playlist::-webkit-scrollbar-thumb {
            background: #2b2b40;
            border-radius: 3px;
        }

        .playlist li {
            padding: 16px 24px;
            border-bottom: 1px solid #1f1f2e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            transition: background 0.2s ease;
        }

        .playlist li:hover {
            background: #1f1f2e;
        }

        .playlist li .track-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .playlist li .title {
            font-size: clamp(0.9rem, 3.2vw, 1rem);
            color: #dcdce6;
            font-weight: 500;
        }

        .playlist li .resolution {
            font-size: 0.75rem;
            color: #8a8aab;
        }

        .download-badge {
            font-size: 0.8rem;
            background: #7c5cfc;
            padding: 8px 16px;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .download-badge:hover {
            background: #6a4ce0;
        }

        /* Strict Mobile Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 0;
                align-items: flex-start;
            }

            .container {
                border-radius: 0;
                border: none;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            .playlist {
                max-height: none;
                flex: 1;
            }

            .playlist li {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>The Remarried Empress</h1>
            <p>Hindi Fan Dubbed Series — Tap an episode to download</p>
        </div>

        <div class="playlist-section">
            <div class="playlist-header">Available Episodes</div>
            <ul class="playlist" id="playlist"></ul>
        </div>
    </div>

    <script>
        const episodes = [
            {
                title: "The Remarried Empress Hindi Fan Dubbed S01E01",
                resolution: "1080p",
                src: "https://drive.google.com/uc?export=download&id=1W71XKH48n_MphepQ5SL0EtnQDtUZH-50"
            },
            {
                title: "The Remarried Empress Hindi Fan Dubbed S01E02",
                resolution: "1080p",
                src: "https://drive.google.com/uc?export=download&id=1WGtwiIi81qiAO_btQkHrHbrVQlCwkLQr"
            },
            {
                title: "The Remarried Empress Hindi Fan Dubbed S01E03",
                resolution: "480p",
                src: "https://drive.google.com/uc?export=download&id=1mSR18Qs362a5zmbyBEYhmkg7Md4yxjTi"
            },
            {
                title: "The Remarried Empress Hindi Fan Dubbed S01E04",
                resolution: "1080p",
                src: "https://drive.google.com/uc?export=download&id=1LnKXvCuRj7Rkw_sMrB-CvExPnprh1W_r"
            }
        ];

        const playlistUI = document.getElementById('playlist');

        episodes.forEach((episode) => {
            const li = document.createElement('li');
            li.innerHTML = `
                <div class="track-info">
                    <span class="title">${episode.title}</span>
                    <span class="resolution">${episode.resolution}</span>
                </div>
                <a href="${episode.src}" class="download-badge" download>
                    Download
                </a>
            `;
            playlistUI.appendChild(li);
        });
    </script>
</body>
</html>
